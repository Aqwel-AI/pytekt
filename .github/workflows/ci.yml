name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/test_db_sqlite.py tests/test_db_query.py tests/test_db_chat_bridge.py tests/test_install_splash.py tests/test_universe_units.py tests/test_universe_time.py tests/test_universe_coordinates.py tests/test_universe_observing.py tests/test_universe_cosmology.py tests/test_universe_web_api.py tests/test_universe_server.py tests/test_universe_native.py -q

      - name: DB demo smoke
        run: |
          python -m aion.db.examples.demo_connect
