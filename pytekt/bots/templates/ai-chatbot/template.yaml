id: ai-chatbot
name: AI Chatbot
description: Pre-wired bots.ai setup with ask/reply_ai connected to placeholder provider
platforms:
  - telegram
  - discord
with_ai: true
with_db: false
with_roles: false
with_i18n: false
with_scheduler: false
with_payments: false
with_ui: false
minimal: false
extra_env:
  OPENAI_API_KEY: sk-example-key-for-ai
extra_deps:
  - openai>=1.0.0
